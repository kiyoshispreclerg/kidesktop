# make lint (-Werror build of every component, cppcheck, .po/.desktop/
# script checks) on every distro the packages target.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - name: Install git
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh cppcheck desktop-file-utils python3
      - name: make lint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make lint
