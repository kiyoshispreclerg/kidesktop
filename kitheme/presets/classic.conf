# KiTheme preset: Classic (Windows 9x) -- square two-pixel bevels, navy
# selection, block progress bar, dotted focus.
style = classic
window_bg = #c0c0c0
window_fg = #000000
base_bg = #ffffff
base_fg = #000000
button_bg = #c0c0c0
button_fg = #000000
selection_bg = #000080
selection_fg = #ffffff
accent = #000080
progress = #000080
menu_bg = #c0c0c0
menu_fg = #000000
tooltip_bg = #ffffe1
tooltip_fg = #000000
radius = 0.00
relief = 1.00
gradient = 0.00
shadow = 0.00
focus = dotted
hover_glow = 0
