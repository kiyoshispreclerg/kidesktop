# KiTheme preset: Oxygen (KDE 4) -- soft gradients, glow on hover/focus,
# thick progress bars with the percentage inside. These are also the
# built-in defaults (kt_theme_defaults() in core/kt_config.c).
style = soft
window_bg = #e0dfde
window_fg = #141312
base_bg = #ffffff
base_fg = #1f1c1b
button_bg = #e8e7e6
button_fg = #141312
selection_bg = #43ace8
selection_fg = #ffffff
accent = #3aa7dd
progress = #43ace8
menu_bg = #e0dfde
menu_fg = #141312
tooltip_bg = #181513
tooltip_fg = #e7fdff
radius = 3.50
relief = 0.70
gradient = 0.60
shadow = 0.60
focus = glow
hover_glow = 1
progress_thickness = 20
progress_text = always
progress_stripes = 0
progress_animation = 0
scrollbar_width = 15
scrollbar_arrows = 1
check_size = 16
