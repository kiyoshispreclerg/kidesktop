# KiTheme preset: Oxygen (KDE 4) -- soft gradients, glow on hover/focus,
# thick progress bars with the percentage inside. These are also the
# built-in defaults (kt_theme_defaults() in core/kt_config.c).
style = soft
radius = 3.50
relief = 0.70
gradient = 0.60
shadow = 0.60
focus = glow
hover_glow = 1
progress_thickness = 20
progress_text = always
progress_stripes = 0
progress_animation = 0
scrollbar_width = 15
scrollbar_arrows = 1
check_size = 16
menu_radius = 4.00
