# kicomp configuration -- effects/renderer settings written by kiconf.
# [output:...] sections (per-monitor scale) are kept as they were.
# [hotcorners*] sections are the hot corners table.
# See kicomp/README.md for the full key/section reference.

effects=1
animation_duration=160.0
renderer=glx
presenter=auto
single_drawable=0
skip_wm_layers=0
unredirect_fullscreen=1
density=1
claim_ms=500.0
keep_hidden_contents=1
live_windows=all
capture_censor=hide
capture_sessions=2

[shadow]
enabled=1
windows=normal,dialog,splash
windows_passive=tooltip,notification,dock
no_shadow_over_maximized=dock
radius=32
opacity=0.90
offset_x=0
offset_y=6
color=#000000
radius_inactive=12
opacity_inactive=0.50
offset_x_inactive=0
offset_y_inactive=6
color_inactive=#000000

[effect:geometry]
enabled=1
duration=1.00
events=maximize,unmaximize,move,fullscreen,unfullscreen,outline
windows=all

[effect:fade-in]
enabled=1
duration=1.0
easing=in-out
events=open

[effect:fade-out]
enabled=1
duration=1.0
easing=in-out
events=close

[effect:scale-in]
enabled=1
duration=1.00
events=open
windows=windows,menus,!class:xisserve
from=0.10
origin=pointer

[effect:scale-out]
enabled=1
easing=in-out
events=close
to=1.15
origin=window

[effect:shade]
enabled=1
duration=1.0
easing=in-out
events=shade,unshade
windows=windows

[effect:desktop-wall]
enabled=1
duration=1.0
easing=in-out
events=desktop-leave,desktop-enter
distance=1.0
fade=0
parallax_delay=20

[effect:smooth-move]
enabled=0
duration=0.1
events=move
windows=windows
max_lag=48
resize=0

[effect:dodge]
enabled=1
duration=1.0
easing=in-out
strength=1
clearance=10

[effect:visual-bell]
enabled=1
duration=0.5
events=bell
amount=0.035
pulses=1
origin=window

[effect:minimize]
enabled=0
duration=1.0
easing=in-out
events=minimize,restore
windows=windows
fade=1

[effect:expo]
enabled=1
hotkey=Meta+E
duration=1.0
easing=out
margin=24
padding=24
dim=0.82
arrange=stack
background=#000000

[effect:show-windows]
enabled=1
hotkey=Meta+A,
duration=1.0
easing=in-out
windows=windows
dim=0.8
=
margin=48
padding=16
other_outputs=0
hide_docks=1

[effect:stats]
enabled=1
hotkey=Meta+F12
size=260
corner=bottom-right
margin=16

[effect:cover-switch]
enabled=1
angle=60
perspective=1.4
cover=0.5
gap=0.3

[effect:cube]
enabled=1
hotkey=Ctrl+Meta+Button1
hotkey_next=Ctrl+Meta+Right
hotkey_prev=Ctrl+Meta+Left
duration=1.00
easing=out
zoom=0.20
flick_zoom=0.00
perspective=0.70
turns=1.00
tilt_max=80
window_gap=40
window_spacing=26
cap_color=#862a2a
background_color=#888888
background=0.70
flat_docks=1
spin_transparency=0.70
shell=0
skybox=/home/kiyoshi/Downloads/cubelarge2copy.png
skybox_opacity=1.00
skybox_parallax=-2.00
live_windows=all

[effect:wobbly]
enabled=1
stiffness=0.06
drag=0.90
move_factor=0.10
tessellation=12
resize=1

[effect:magic-lamp]
enabled=1
duration=1.00
events=minimize,restore
grid_res=32
waves=1
wave_amp=0.40

[effect:slide-in]
enabled=1
duration=1.00
events=open,restore,desktop-enter
windows=popups,dock,class:xisserve
offset=0.30
direction=auto

[effect:slide-out]
enabled=1
duration=1.00
events=close
windows=popups,class:xisserve
offset=0.30
direction=auto

[effect:peek]
enabled=1
duration=1.00

[hotcorners]
bottom-left=show-windows
bottom-right=expo
delay=200
size=1

